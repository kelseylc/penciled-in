<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Your Penciled.in sign-in code</title>
</head>
<body style="margin:0;padding:0;background-color:#FAF7F2;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#FAF7F2" style="background-color:#FAF7F2;">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFDF9" style="max-width:480px;background-color:#FFFDF9;border-radius:16px;">
<tr><td style="padding:32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;color:#2B2622;">
  <p style="margin:0 0 8px;font-size:18px;font-weight:600;color:#2B2622;">Your sign-in code</p>
  <p style="margin:0 0 24px;font-size:15px;line-height:22px;color:#5C5349;">Enter this code in Penciled.in. It expires in 10 minutes and can only be used once.</p>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td align="center" bgcolor="#F3EDE4" style="background-color:#F3EDE4;border-radius:12px;padding:20px 8px;font-family:-apple-system,BlinkMacSystemFont,Helvetica,sans-serif;font-size:32px;font-weight:700;letter-spacing:8px;color:#2B2622;">{{ .Token }}</td>
  </tr>
  </table>
  <p style="margin:16px 0 24px;font-size:13px;line-height:20px;color:#8A8079;">Code: {{ .Token }}</p>
  <p style="margin:0;font-size:13px;line-height:20px;color:#8A8079;">Didn't ask for this? You can ignore this email.</p>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
