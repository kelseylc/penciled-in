<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Confirm your new Penciled.in email</title>
</head>
<body style="margin:0;padding:0;background-color:#FAF7F2;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#FAF7F2" style="background-color:#FAF7F2;">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFDF9" style="max-width:480px;background-color:#FFFDF9;border-radius:16px;">
<tr><td style="padding:32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;color:#2B2622;">
  <p style="margin:0 0 8px;font-size:18px;font-weight:600;color:#2B2622;">Confirm your new email</p>
  <p style="margin:0 0 24px;font-size:15px;line-height:22px;color:#5C5349;">Confirm the change from {{ .Email }} to {{ .NewEmail }} on your Penciled.in account.</p>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td align="center" bgcolor="#C4633F" style="background-color:#C4633F;border-radius:12px;">
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:16px 32px;font-family:-apple-system,BlinkMacSystemFont,Helvetica,sans-serif;font-size:16px;font-weight:600;color:#FFFDF9;text-decoration:none;border-radius:12px;">Confirm the change</a>
    </td>
  </tr>
  </table>
  <p style="margin:16px 0 24px;font-size:13px;line-height:20px;color:#8A8079;">Or paste this into your browser:<br>{{ .ConfirmationURL }}</p>
  <p style="margin:0;font-size:13px;line-height:20px;color:#8A8079;">Didn't request this? Ignore this email and your address stays as it is.</p>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
